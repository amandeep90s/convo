packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - bullmq@6.3.0
  - '@types/node@26.4.1'
  - emoji-picker-react@4.19.4
  - shadcn@4.20.1
  - '@nestjs/throttler@6.8.0'
  - react-resizable-panels@4.24.0
