services:
  postgres:
    image: postgres:17-alpine
    container_name: convo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: convo_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set it in .env)}
    ports:
      - '55432:5432'
    volumes:
      - convo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d convo_app']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: convo-redis
    restart: unless-stopped
    ports:
      - '56379:6379'
    volumes:
      - convo-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  convo-postgres-data:
  convo-redis-data:
